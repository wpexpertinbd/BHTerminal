[workspace]
resolver = "2"
members = ["crates/bhterm-core", "app/src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["BiswasHost <benjamin.biswas@gmail.com>"]
repository = "https://github.com/wpexpertinbd/BHTerminal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }

# Size matters: these installers are attached to GitHub Releases and Benjamin
# is on the free plan. Same profile as BHNotepad/BHUninstaller.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
