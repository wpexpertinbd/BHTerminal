name: BHTerminal
options:
  bundleIdPrefix: com.biswashost
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.13.0
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc
    branch: main

targets:
  BHTerminal:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BHTerminal
    dependencies:
      - package: SwiftTerm
      # RoyalVNCKit's SPM product is a DYNAMIC library, so it must be copied
      # into the app bundle (Contents/Frameworks) and signed — otherwise the
      # distributed .app crashes at launch with "Library not loaded:
      # @rpath/RoyalVNCKit.framework". (SwiftTerm is static, so it links in
      # and needs no embedding.)
      - package: RoyalVNCKit
        embed: true
        link: true
    info:
      path: BHTerminal/Info.plist
      properties:
        CFBundleDisplayName: BHTerminal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 BiswasHost"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biswashost.BHTerminal
        PRODUCT_NAME: BHTerminal
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Stable self-signed identity (not ad-hoc "-") so the app's code
        # signature stays constant across rebuilds. macOS ties Keychain
        # access ACLs to the signature; with ad-hoc signing every rebuild
        # produced a new signature, so "Always Allow" never stuck and the
        # saved-password prompt reappeared on each build. With this fixed
        # identity, one "Always Allow" holds permanently.
        CODE_SIGN_IDENTITY: "BHTerminal Dev"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: BHTerminal/BHTerminal.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        # Hardened Runtime is applied to the SHIPPED (Release) build only:
        # it blocks DYLD_INSERT_LIBRARIES injection and debugger attach so
        # another local process can't read the app's decrypted SSH/VNC
        # secrets or ride its Keychain grant. It's deliberately OFF in Debug
        # because library validation (implied by hardened runtime) refuses
        # to load the separately-signed XCTest bundle, breaking the tests.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Don't let Xcode inject the debug "get-task-allow" entitlement into
          # the shipped build — with it present, any local process could
          # debugger-attach and read decrypted secrets, defeating the whole
          # point of Hardened Runtime here.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  BHTerminalTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BHTerminalTests
    dependencies:
      - target: BHTerminal
    settings:
      base:
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BHTerminal:
    build:
      targets:
        BHTerminal: all
        BHTerminalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BHTerminalTests
