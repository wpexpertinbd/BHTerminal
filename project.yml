name: BHTerminal
options:
  bundleIdPrefix: com.biswashost
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.13.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.1
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc
    branch: main

targets:
  BHTerminal:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BHTerminal
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: RoyalVNCKit
    info:
      path: BHTerminal/Info.plist
      properties:
        CFBundleDisplayName: BHTerminal
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 BiswasHost"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biswashost.BHTerminal
        PRODUCT_NAME: BHTerminal
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  BHTerminalTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BHTerminalTests
    dependencies:
      - target: BHTerminal
    settings:
      base:
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BHTerminal:
    build:
      targets:
        BHTerminal: all
        BHTerminalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BHTerminalTests
