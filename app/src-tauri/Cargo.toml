[package]
name = "bhterminal"
description = "SSH · SFTP · VNC client for macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "bhterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bhterm-core = { path = "../../crates/bhterm-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Unix pty AND Windows ConPTY behind one API — the reason a single terminal
# implementation can serve all three platforms. From the WezTerm project.
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true
base64 = "0.22"
