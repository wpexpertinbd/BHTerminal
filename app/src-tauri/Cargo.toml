[package]
name = "bhterminal"
description = "SSH · SFTP · VNC client for macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "bhterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bhterm-core = { path = "../../crates/bhterm-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Unix pty AND Windows ConPTY behind one API — the reason a single terminal
# implementation can serve all three platforms. From the WezTerm project.
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true
base64 = "0.22"
# The VNC bridge. A VNC server speaks raw TCP and a webview can only open a
# WebSocket, so this is the adapter between them — the same job websockify
# does. Tauri already brings tokio, so the marginal cost is small, and the
# async split() is what makes a clean bidirectional pump possible.
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "macros"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
